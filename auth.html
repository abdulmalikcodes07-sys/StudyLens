<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to StudyLens</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="auth-body">

    <div class="auth-container">

        <a href="index.html" class="logo">
            StudyLens
        </a>

        <div class="auth-card">

            <div class="auth-heading">

                <h1 id="formTitle">Create your account</h1>

                <p id="formDescription">
                    Start your smarter learning journey today.
                </p>

            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">Email Address</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit" class="btn btn-primary auth-submit">

                    Create Account

                </button>

            </form>


            <!-- LOGIN FORM -->

            <form id="loginForm" class="hidden">

                <div class="form-group">

                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="btn btn-primary auth-submit">

                    Login

                </button>

            </form>


            <p id="authMessage" class="auth-message"></p>


            <div class="auth-switch">

                <p id="switchText">
                    Already have an account?
                    <button type="button" id="showLogin">Login</button>
                </p>

            </div>

        </div>


        <p class="auth-footer">
            © 2026 StudyLens. All rights reserved.
        </p>

    </div>


    <script type="module" src="auth.js"></script>

</body>

</html>
